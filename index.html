<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mapa de Negocios</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:#0A0E17;color:#E0E0E0;overflow:hidden}

#map{position:fixed;inset:0;z-index:1;background:#0A0E17}

.search-wrap{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  padding:12px 12px 12px;padding-top:calc(12px + env(safe-area-inset-top));
  background:linear-gradient(180deg,rgba(0,0,0,0.95) 0%,rgba(0,0,0,0) 100%);
  display:flex;justify-content:center;pointer-events:none;
}
.search-inner{width:100%;max-width:520px;position:relative;pointer-events:auto}
.search-input{
  width:100%;padding:14px 18px 14px 46px;
  border:2px solid #7B2FF7;border-radius:12px;
  background:rgba(10,14,23,0.95);color:#E0E0E0;
  font-size:15px;font-weight:600;
  box-shadow:0 0 25px rgba(123,47,247,0.35);
  transition:border-color .2s,box-shadow .2s;
  backdrop-filter:blur(8px);
}
.search-input:focus{outline:none;border-color:#00D4FF;box-shadow:0 0 30px rgba(0,212,255,0.5)}
.search-input::placeholder{color:#666;font-weight:500}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none;opacity:.7}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#888;font-size:22px;cursor:pointer;display:none;padding:4px 8px}
.search-clear.visible{display:block}

.results{
  margin-top:10px;background:rgba(10,14,23,0.98);
  border:1px solid #7B2FF7;border-radius:12px;
  max-height:340px;overflow-y:auto;
  box-shadow:0 0 30px rgba(123,47,247,0.4);
  display:none;backdrop-filter:blur(10px);
}
.results.visible{display:block}
.result-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;cursor:pointer;
  border-bottom:1px solid rgba(123,47,247,0.2);
  transition:background .15s;
}
.result-item:last-child{border-bottom:none}
.result-item:hover,.result-item.active{background:rgba(123,47,247,0.15)}
.result-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #00D4FF;flex-shrink:0;background:#1A1A2E}
.result-logo-empty{width:36px;height:36px;border-radius:50%;background:#1A1A2E;border:2px solid #444;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.result-info{flex:1;min-width:0}
.result-nombre{font-size:13.5px;font-weight:700;color:#E0E0E0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-desc{font-size:11px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.result-badge{font-size:9px;padding:3px 8px;border-radius:10px;font-weight:700;flex-shrink:0}
.result-badge.ubicado{background:rgba(0,255,136,0.15);color:#00FF88}
.result-badge.sin-ubicacion{background:rgba(255,179,0,0.15);color:#FFB300}
.results-empty{padding:20px;text-align:center;color:#666;font-size:13px}

.counter{
  position:fixed;top:calc(80px + env(safe-area-inset-top));right:12px;z-index:999;
  background:rgba(10,14,23,0.9);border:1px solid #7B2FF7;border-radius:10px;
  padding:6px 14px;font-size:12px;font-weight:700;color:#00D4FF;
  backdrop-filter:blur(8px);
  box-shadow:0 0 20px rgba(123,47,247,0.35);
}

.leaflet-popup-content-wrapper{
  background:transparent!important;border-radius:16px!important;
  box-shadow:0 10px 40px rgba(0,0,0,0.6),0 0 40px rgba(123,47,247,0.5)!important;
  padding:0!important;overflow:hidden;
}
.leaflet-popup-content{margin:0!important;width:280px!important;line-height:1.5!important}
.leaflet-popup-tip{background:#1A1A2E!important;box-shadow:0 0 20px rgba(123,47,247,0.5)!important}
.leaflet-popup-close-button{
  color:#fff!important;font-size:22px!important;
  width:28px!important;height:28px!important;
  top:8px!important;right:8px!important;
  background:rgba(0,0,0,0.5)!important;border-radius:50%!important;
  backdrop-filter:blur(6px);
  z-index:10!important;
}
.leaflet-popup-close-button:hover{background:rgba(255,0,64,0.7)!important}

.pop-banner{
  width:100%;height:130px;
  background-size:cover;background-position:center;
  background-color:#1A1A2E;position:relative;
}
.pop-banner::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(10,14,23,0.95) 100%);
}
.pop-logo{
  position:absolute;bottom:-24px;left:16px;
  width:56px;height:56px;border-radius:50%;
  border:3px solid #00D4FF;object-fit:cover;
  background:#1A1A2E;z-index:2;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
}
.pop-body{padding:32px 16px 16px;background:#1A1A2E}
.pop-nombre{font-size:16px;font-weight:800;color:#E0E0E0;line-height:1.25;margin-bottom:4px}
.pop-slogan{font-size:12px;color:#00D4FF;font-style:italic;font-weight:600;margin-bottom:10px;line-height:1.3}
.pop-desc{font-size:11.5px;color:#AAA;line-height:1.5;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pop-actions{display:flex;gap:8px}
.pop-btn{
  flex:1;padding:10px 12px;border-radius:10px;
  font-size:12.5px;font-weight:700;text-align:center;
  text-decoration:none;border:none;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  transition:transform .15s;
}
.pop-btn:active{transform:scale(0.96)}
.pop-btn-landing{background:linear-gradient(135deg,#7B2FF7,#00D4FF);color:#fff}
.pop-btn-maps{background:#4285F4;color:#fff}

.landing-modal{
  position:fixed;inset:0;z-index:10000;
  background:rgba(0,0,0,0.92);backdrop-filter:blur(8px);
  display:none;flex-direction:column;
  padding:0;
}
.landing-modal.active{display:flex}
.landing-header{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));
  background:linear-gradient(135deg,#7B2FF7,#FF00E5,#00D4FF);
  color:#fff;
}
.landing-header-info{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.landing-header-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.7);flex-shrink:0;background:#fff}
.landing-header-nombre{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 8px rgba(0,0,0,0.4)}
.landing-header-actions{display:flex;gap:6px;flex-shrink:0}
.landing-btn{
  background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.5);
  color:#fff;width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:17px;text-decoration:none;
  transition:background .2s;
}
.landing-btn:hover{background:rgba(0,0,0,0.6)}
.landing-btn-close{background:rgba(255,0,64,0.6)}
.landing-btn-close:hover{background:rgba(255,0,64,0.9)}
.landing-frame{
  flex:1;width:100%;border:none;background:#fff;
}

.loading{
  position:fixed;inset:0;z-index:10001;
  background:rgba(10,14,23,0.95);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;
}
.loading.active{display:flex}
.spinner{
  width:50px;height:50px;border:4px solid #1A1A2E;
  border-top-color:#00D4FF;border-radius:50%;
  animation:spin .8s linear infinite;
  box-shadow:0 0 30px rgba(0,212,255,0.5);
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:#00D4FF;font-weight:600;font-size:14px}

.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  padding:14px 24px;border-radius:12px;font-weight:700;font-size:13px;
  z-index:10002;max-width:90vw;text-align:center;
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.toast-success{background:linear-gradient(135deg,#00FF88,#00D4FF);color:#0A0E17;box-shadow:0 0 30px rgba(0,255,136,0.5)}
.toast-error{background:linear-gradient(135deg,#FF0040,#FF00E5);color:#fff;box-shadow:0 0 30px rgba(255,0,64,0.5)}

@media (max-width:480px){
  .leaflet-popup-content{width:250px!important}
  .counter{font-size:11px;padding:5px 10px}
}
</style>
</head>
<body>

<div id="map"></div>

<div class="search-wrap">
  <div class="search-inner">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" class="search-input" placeholder="Buscar negocio..." autocomplete="off">
    <button class="search-clear" id="searchClear" aria-label="Limpiar">×</button>
    <div class="results" id="results"></div>
  </div>
</div>

<div class="counter" id="counter">Cargando...</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>Cargando negocios...</p>
</div>

<div class="landing-modal" id="landingModal">
  <div class="landing-header">
    <div class="landing-header-info">
      <img class="landing-header-logo" id="landingLogo" alt="" onerror="this.style.display='none'">
      <span class="landing-header-nombre" id="landingNombre">Landing</span>
    </div>
    <div class="landing-header-actions">
      <button class="landing-btn" id="landingOpenNew" title="Abrir en pestaña nueva">🔗</button>
      <button class="landing-btn landing-btn-close" id="landingClose" title="Cerrar">✖</button>
    </div>
  </div>
  <iframe class="landing-frame" id="landingFrame" sandbox="allow-scripts allow-popups allow-forms allow-modals allow-same-origin"></iframe>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzC0XThmPutT8VjPMyYiRrvVIREMr3LfHeRIYsFFJ8wT_H-3vmKcaAuqbz337BahBmPeg/exec';
const GITHUB_USER = 'proyectosolaronline';
const GITHUB_PAGES_BASE = 'https://' + GITHUB_USER + '.github.io';
const GOOGLE_VERIFICATION = 'o7Qk58AlI2FmeW05yL8c0p5epUhBa8rBgb6ldSqReOo';

/* ============================================================
   ESTADO
   ============================================================ */
let negocios = [];
let map = null;
let markerGroup = null;
let markersPorId = {};
let negocioSeleccionado = null;

/* ============================================================
   HELPERS
   ============================================================ */
function escHTML(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function escJS(s){
  return String(s == null ? '' : s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/</g,'\\x3C').replace(/[\n\r]/g,' ');
}
function slugify(nombre){
  return String(nombre || 'negocio')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/ñ/gi,'n').replace(/[^a-zA-Z0-9\s-]/g,'')
    .trim().replace(/\s+/g,'-');
}
function urlLanding(n){
  return GITHUB_PAGES_BASE + '/' + encodeURIComponent(slugify(n.nombre)) + '/';
}
function tieneCoords(n){
  const lat = parseFloat(n.latitud), lng = parseFloat(n.longitud);
  return !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0;
}
function showToast(msg, tipo){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast toast-' + (tipo || 'success');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3200);
}
function showLoading(){ document.getElementById('loading').classList.add('active'); }
function hideLoading(){ document.getElementById('loading').classList.remove('active'); }

/* ============================================================
   API (JSONP)
   ============================================================ */
function callAPI(action, params = {}) {
  return new Promise((resolve, reject) => {
    const callbackName = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    window[callbackName] = function(result) {
      delete window[callbackName];
      if (script.parentNode) document.body.removeChild(script);
      resolve(result);
    };
    let url = `${APPS_SCRIPT_URL}?action=${action}&callback=${callbackName}`;
    for (const key in params) {
      url += `&${key}=${encodeURIComponent(typeof params[key] === 'object' ? JSON.stringify(params[key]) : params[key])}`;
    }
    const script = document.createElement('script');
    script.src = url;
    script.onerror = function() {
      delete window[callbackName];
      if (script.parentNode) document.body.removeChild(script);
      reject(new Error('Error de conexión'));
    };
    document.body.appendChild(script);
  });
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  inicializarMapa();
  cargarNegocios();

  document.getElementById('searchInput').addEventListener('input', onSearchInput);
  document.getElementById('searchInput').addEventListener('focus', () => {
    if (document.getElementById('searchInput').value.trim()) {
      document.getElementById('results').classList.add('visible');
    }
  });
  document.getElementById('searchClear').addEventListener('click', limpiarBusqueda);
  document.getElementById('landingClose').addEventListener('click', cerrarLanding);

  document.addEventListener('click', (e) => {
    const results = document.getElementById('results');
    const searchInner = document.querySelector('.search-inner');
    if (results && searchInner && !searchInner.contains(e.target)) {
      results.classList.remove('visible');
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (document.getElementById('landingModal').classList.contains('active')) {
        cerrarLanding();
      } else {
        document.getElementById('results').classList.remove('visible');
      }
    }
  });
});

/* ============================================================
   MAPA
   ============================================================ */
function inicializarMapa() {
  map = L.map('map', {
    center: [23.6345, -102.5528],
    zoom: 5,
    minZoom: 3,
    maxZoom: 19,
    zoomControl: false
  });

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 19
  });
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '© Esri', maxZoom: 19
  });
  osm.addTo(map);
  L.control.layers({ '🌍 Calle': osm, '🛰️ Satélite': sat }, null, { position: 'bottomleft' }).addTo(map);

  markerGroup = L.featureGroup().addTo(map);
}

/* ============================================================
   CARGAR NEGOCIOS
   ============================================================ */
async function cargarNegocios() {
  showLoading();
  try {
    const result = await callAPI('obtenerNegocios');
    hideLoading();
    if (result && result.success) {
      negocios = (result.negocios || []).filter(n => n && n.nombre);
      pintarMapa();
      actualizarContador();
    } else {
      showToast('Error al cargar negocios', 'error');
      document.getElementById('counter').textContent = 'Error';
    }
  } catch (e) {
    hideLoading();
    showToast('Error de conexión', 'error');
    document.getElementById('counter').textContent = 'Sin conexión';
  }
}

function pintarMapa() {
  markerGroup.clearLayers();
  markersPorId = {};

  const conUbicacion = negocios.filter(tieneCoords);

  conUbicacion.forEach(n => {
    const lat = parseFloat(n.latitud);
    const lng = parseFloat(n.longitud);

    const icon = L.divIcon({
      className: 'custom-pin',
      html: '<div style="' +
        'width:38px;height:38px;border-radius:50% 50% 50% 0;' +
        'background:linear-gradient(135deg,#7B2FF7,#00D4FF);' +
        'transform:rotate(-45deg);' +
        'border:3px solid #fff;' +
        'box-shadow:0 4px 15px rgba(123,47,247,0.6);' +
        'display:flex;align-items:center;justify-content:center;' +
        'cursor:pointer;' +
        '">' +
        (n.logo ?
          '<img src="' + escHTML(n.logo) + '" style="width:26px;height:26px;border-radius:50%;object-fit:cover;transform:rotate(45deg);border:2px solid #fff;background:#fff;" onerror="this.style.display=\'none\'">' :
          '<span style="transform:rotate(45deg);font-size:16px;">🏪</span>') +
        '</div>',
      iconSize: [38, 38],
      iconAnchor: [19, 38],
      popupAnchor: [0, -38]
    });

    const marker = L.marker([lat, lng], { icon }).addTo(markerGroup);
    marker.bindPopup(construirPopup(n), {
      maxWidth: 320,
      minWidth: 280,
      closeButton: true,
      autoPanPadding: [30, 80]
    });
    marker.negocioId = n.id;
    markersPorId[n.id] = marker;
  });

  if (conUbicacion.length > 0) {
    try {
      const bounds = markerGroup.getBounds();
      if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [80, 80], maxZoom: 12 });
      }
    } catch(e) {}
  }
}

function construirPopup(n) {
  const lat = parseFloat(n.latitud);
  const lng = parseFloat(n.longitud);
  const bannerURL = n.banner || '';
  const logoURL = n.logo || '';
  const desc = (n.descripcion || '').split('&')[0].trim();

  return `
    <div class="pop-banner" style="${bannerURL ? 'background-image:url(\'' + escHTML(bannerURL).replace(/'/g, "%27") + '\');' : ''}">
      ${logoURL ? '<img class="pop-logo" src="' + escHTML(logoURL) + '" alt="" onerror="this.style.display=\'none\'">' : ''}
    </div>
    <div class="pop-body">
      <div class="pop-nombre">${escHTML(n.nombre)}</div>
      ${n.slogan ? '<div class="pop-slogan">✨ ' + escHTML(n.slogan) + '</div>' : ''}
      ${desc ? '<div class="pop-desc">' + escHTML(desc) + '</div>' : ''}
      <div class="pop-actions">
        <button class="pop-btn pop-btn-landing" onclick="abrirLanding('${escJS(n.id)}')">🌐 Ver landing</button>
        <a class="pop-btn pop-btn-maps" href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank" rel="noopener">🧭 Cómo llegar</a>
      </div>
    </div>
  `;
}

/* ============================================================
   BUSCADOR
   ============================================================ */
function onSearchInput(e) {
  const term = e.target.value.trim().toLowerCase();
  const clearBtn = document.getElementById('searchClear');
  const results = document.getElementById('results');

  if (term) clearBtn.classList.add('visible');
  else clearBtn.classList.remove('visible');

  if (!term) {
    results.classList.remove('visible');
    results.innerHTML = '';
    Object.values(markersPorId).forEach(m => {
      if (!markerGroup.hasLayer(m)) markerGroup.addLayer(m);
    });
    actualizarContador();
    return;
  }

  const coincidencias = negocios.filter(n => {
    const t = term;
    return (n.nombre || '').toLowerCase().includes(t) ||
           (n.descripcion || '').toLowerCase().includes(t) ||
           (n.direccion || '').toLowerCase().includes(t) ||
           (n.ubicacion || '').toLowerCase().includes(t) ||
           (n.slogan || '').toLowerCase().includes(t);
  });

  const idsCoincidentes = new Set(coincidencias.map(n => n.id));
  Object.entries(markersPorId).forEach(([id, marker]) => {
    if (idsCoincidentes.has(id)) {
      if (!markerGroup.hasLayer(marker)) markerGroup.addLayer(marker);
    } else {
      if (markerGroup.hasLayer(marker)) markerGroup.removeLayer(marker);
    }
  });

  const conCoords = coincidencias.filter(tieneCoords);
  if (conCoords.length > 0) {
    if (conCoords.length === 1) {
      const n = conCoords[0];
      map.setView([parseFloat(n.latitud), parseFloat(n.longitud)], 15);
    } else {
      const bounds = L.latLngBounds(conCoords.map(n => [parseFloat(n.latitud), parseFloat(n.longitud)]));
      map.fitBounds(bounds, { padding: [80, 80], maxZoom: 13 });
    }
  }

  actualizarContador(coincidencias.length);
  renderizarResultados(coincidencias);
}

function renderizarResultados(lista) {
  const results = document.getElementById('results');
  if (lista.length === 0) {
    results.innerHTML = '<div class="results-empty">📭 Sin resultados</div>';
    results.classList.add('visible');
    return;
  }

  results.innerHTML = lista.slice(0, 30).map(n => {
    const c = tieneCoords(n);
    return `
      <div class="result-item" data-id="${escHTML(n.id)}" onclick="seleccionarResultado('${escJS(n.id)}')">
        ${n.logo ?
          '<img class="result-logo" src="' + escHTML(n.logo) + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
          '<div class="result-logo-empty" style="display:none">🏪</div>' :
          '<div class="result-logo-empty">🏪</div>'}
        <div class="result-info">
          <div class="result-nombre">${escHTML(n.nombre)}</div>
          ${n.slogan ? '<div class="result-desc">' + escHTML(n.slogan) + '</div>' : ''}
        </div>
        <span class="result-badge ${c ? 'ubicado' : 'sin-ubicacion'}">${c ? '📍' : '⚠️ Sin ubicación'}</span>
      </div>
    `;
  }).join('');
  results.classList.add('visible');
}

function seleccionarResultado(id) {
  const n = negocios.find(x => x.id === id);
  if (!n) return;

  document.getElementById('results').classList.remove('visible');

  if (tieneCoords(n)) {
    const lat = parseFloat(n.latitud);
    const lng = parseFloat(n.longitud);
    map.setView([lat, lng], 16);
    const marker = markersPorId[n.id];
    if (marker) {
      setTimeout(() => {
        marker.openPopup();
      }, 350);
    }
  } else {
    showToast('⚠️ Este negocio no tiene ubicación. Abriendo landing...', 'success');
    setTimeout(() => abrirLanding(id), 600);
  }
}

function limpiarBusqueda() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('visible');
  document.getElementById('results').classList.remove('visible');
  document.getElementById('results').innerHTML = '';

  Object.values(markersPorId).forEach(m => {
    if (!markerGroup.hasLayer(m)) markerGroup.addLayer(m);
  });

  actualizarContador();

  if (markerGroup.getLayers().length > 0) {
    try {
      const bounds = markerGroup.getBounds();
      if (bounds.isValid()) map.fitBounds(bounds, { padding: [80, 80], maxZoom: 12 });
    } catch(e) {}
  }
}

function actualizarContador(filtrados) {
  const total = negocios.length;
  const conUbi = negocios.filter(tieneCoords).length;
  const counter = document.getElementById('counter');
  if (typeof filtrados === 'number') {
    counter.textContent = filtrados + ' / ' + total;
  } else {
    counter.textContent = conUbi + ' en mapa · ' + total + ' total';
  }
}
